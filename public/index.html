<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>claude-to-go</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: Menlo, Monaco, 'Courier New', monospace;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100vh;
    }

    #terminal-container {
      flex: 1;
      min-height: 0;
      padding: 4px;
      overflow: hidden;
    }

    #terminal {
      height: 100%;
    }

    #input-area {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background: #1e1e1e;
      border-top: 1px solid #333;
      align-items: flex-end;
    }

    #text-input {
      flex: 1;
      min-height: 36px;
      max-height: 120px;
      padding: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #2d2d2d;
      color: #d4d4d4;
      border: 1px solid #444;
      border-radius: 4px;
      resize: none;
      outline: none;
    }

    #text-input:focus {
      border-color: #666;
    }

    #text-input::placeholder {
      color: #666;
    }

    .btn {
      height: 36px;
      padding: 0 12px;
      font-size: 13px;
      font-family: inherit;
      background: #333;
      color: #d4d4d4;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .btn:active {
      background: #444;
    }

    #ptt-btn.recording {
      background: #6b2020;
      border-color: #933;
      color: #f99;
    }

    #status {
      font-size: 11px;
      color: #666;
      padding: 2px 8px;
      text-align: center;
    }


    /* Prevent zoom on iOS */
    input, textarea, select {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="terminal-container">
      <div id="terminal"></div>
    </div>
    <div id="status">Connecting...</div>
    <div id="input-area">
      <textarea id="text-input" rows="1" placeholder=""></textarea>
      <button id="ptt-btn" class="btn" title="Hold to speak">mic</button>
      <button id="send-btn" class="btn" title="Send">run</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
