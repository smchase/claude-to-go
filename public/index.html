<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>clod2go</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #1e1e1e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100vh;
    }

    #terminal-container {
      flex: 1;
      min-height: 0;
      padding: 4px;
      overflow: hidden;
    }

    #terminal {
      height: 100%;
    }

    #input-area {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #2d2d2d;
      border-top: 1px solid #444;
      align-items: flex-end;
    }

    #text-input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      resize: none;
      outline: none;
    }

    #text-input:focus {
      border-color: #666;
    }

    .btn {
      min-width: 50px;
      height: 44px;
      padding: 0 16px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    #ptt-btn {
      background: #3b82f6;
      color: white;
      min-width: 60px;
    }

    #ptt-btn:active, #ptt-btn.recording {
      background: #ef4444;
    }

    #ptt-btn.recording {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    #send-btn {
      background: #22c55e;
      color: white;
    }

    #send-btn:active {
      background: #16a34a;
    }

    #status {
      font-size: 12px;
      color: #888;
      padding: 4px 8px;
      text-align: center;
    }

    /* Prevent zoom on iOS */
    input, textarea, select {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="terminal-container">
      <div id="terminal"></div>
    </div>
    <div id="status">Connecting...</div>
    <div id="input-area">
      <textarea id="text-input" rows="1" placeholder="Type or hold mic to speak..."></textarea>
      <button id="ptt-btn" class="btn" title="Hold to speak">Mic</button>
      <button id="send-btn" class="btn" title="Send to terminal">Send</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
